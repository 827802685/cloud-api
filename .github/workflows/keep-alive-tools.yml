name: Keep Tools Service Awake (Render)

on:
  schedule:
    # Render free/starter 实例空闲 15 分钟后休眠；每 10 分钟 ping 一次 /health 保持常醒。
    # GitHub Actions 定时任务最小间隔约 5 分钟，10 分钟足够且不浪费配额。
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive-tools
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Tools Service health endpoint
        env:
          HEALTH_URL: ${{ vars.TOOLS_SERVICE_HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://cloud-api-tools.onrender.com/health}"
          echo "Pinging ${URL}"
          curl -fsS -o /dev/null -w "health status: %{http_code}\n" "$URL" \
            || echo "Render tools service unreachable (will cold-start on demand)"
